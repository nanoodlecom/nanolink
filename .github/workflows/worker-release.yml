name: Nanolink Worker release

on:
  pull_request:
    paths:
      - .github/workflows/worker-release.yml
      - wrangler.jsonc
      - 'src/**'
      - 'support/**'
      - 'test/**'
  workflow_run:
    workflows: [test]
    branches: [main]
    types: [completed]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: source
        run: printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Test Nanolink in local Workers runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/nanolink-tools" --no-save miniflare@4.20260730.0 wrangler@4.164.0
          NANOLINK_MINIFLARE_MODULE="$RUNNER_TEMP/nanolink-tools/node_modules/miniflare/dist/src/index.js" \
            node support/workerd-check.mjs
      - name: Build and verify the Worker without credentials
        run: |
          "$RUNNER_TEMP/nanolink-tools/node_modules/.bin/wrangler" deploy --dry-run --strict \
            --outdir "$RUNNER_TEMP/nanolink" --outfile "$RUNNER_TEMP/nanolink/worker.multipart"
          node --check "$RUNNER_TEMP/nanolink/worker.js"
          python3 support/check-worker-release.py "$RUNNER_TEMP/nanolink/worker.multipart"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: nanolink-${{ steps.source.outputs.revision }}
          path: |
            ${{ runner.temp }}/nanolink/worker.js
            ${{ runner.temp }}/nanolink/worker.js.map
            ${{ runner.temp }}/nanolink/worker.multipart
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_run'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: cloudflare-nanolink
      url: https://link.nanoodle.com/
    concurrency:
      group: nanolink-production
      cancel-in-progress: false
    steps:
      - name: Check current main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$REVISION" == "$latest" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main has moved to a newer revision. Its test run will trigger delivery."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.current == 'true'
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.source.outputs.current == 'true'
        with:
          node-version: "24.22.1"
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.current == 'true'
        with:
          name: nanolink-${{ needs.build.outputs.revision }}
          path: ${{ runner.temp }}/nanolink
      - name: Verify the first-writer cutover and publish the tested Worker
        if: steps.source.outputs.current == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_NANOLINK_API_TOKEN }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the account in cloudflare-nanolink}"
          : "${CLOUDFLARE_API_TOKEN:?Set the Worker credential in cloudflare-nanolink after the first-writer cutover}"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          get() { curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$1"; }
          target=scripts/nanolink
          active_version() {
            get "$target/deployments" | jq -er '
              .result.deployments | max_by(.created_on) | .versions |
              select(length == 1 and .[0].percentage == 100) | .[0].version_id'
          }
          before=$(active_version)
          get "$target/settings" > "$RUNNER_TEMP/nanolink-settings.json"
          python3 support/check-worker-release.py "$RUNNER_TEMP/nanolink/worker.multipart" \
            --live "$RUNNER_TEMP/nanolink-settings.json"
          get domains | jq -e '.result | any(.hostname == "link.nanoodle.com" and .service == "nanolink")'
          printf 'Previous Worker version `%s`\n' "$before" >> "$GITHUB_STEP_SUMMARY"

          npx --yes wrangler@4.164.0 deploy "$RUNNER_TEMP/nanolink/worker.js" \
            --no-bundle --strict --name nanolink --tag "$REVISION" --message "Merge $REVISION"
          version=$(active_version)
          get "$target/versions/$version" | jq -e --arg sha "$REVISION" '.result.annotations["workers/tag"] == $sha'
          get "$target/settings" > "$RUNNER_TEMP/nanolink-settings.json"
          python3 support/check-worker-release.py "$RUNNER_TEMP/nanolink/worker.multipart" \
            --live "$RUNNER_TEMP/nanolink-settings.json"
          curl -fsSI --max-time 20 https://link.nanoodle.com/ > /dev/null
          printf 'Worker version `%s` serves commit `%s`\n' "$version" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
